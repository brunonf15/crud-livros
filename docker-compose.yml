services:
  db:
    image: mysql:8.0
    container_name: crudlivros_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: crudlivros
      MYSQL_USER: crudlivros
      MYSQL_PASSWORD: crudlivros123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot123']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: crudlivros_adminer
    restart: unless-stopped
    ports:
      - '8081:8080'
    depends_on:
      - db

volumes:
  mysql_data:

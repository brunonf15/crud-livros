<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Carros</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      margin: 0;
      padding: 0;
    }
    
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    
    h1, h2 {
      text-align: center;
      color: #444;
    }
    
    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    form button {
      grid-column: 1 / -1;
    }
    
    input[type="text"],
    input[type="number"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    button {
      padding: 10px;
      background-color: #28a745;
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    
    button:hover {
      background-color: #218838;
    }
    
    ul {
      list-style: none;
      padding: 0;
    }
    
    ul li {
      background: #e9ecef;
      margin-bottom: 8px;
      padding: 10px;
      border-radius: 4px;
    }
    
    .form-group {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .form-group input {
      flex: 1;
      max-width: 200px;
    }
    
    #carro-encontrado {
      text-align: center;
      padding: 10px;
      background-color: #ffc107;
      border-radius: 4px;
      margin-top: 10px;
    }
    
    #btn-listar {
      background-color: #007BFF;
    }
    
    #btn-listar:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚗 Gerenciamento de Carros</h1>

    <h2>Adicionar Carro</h2>
    <form id="form-adicionar">
      <input type="text" id="marca" placeholder="Marca (ex: Toyota)" required>
      <input type="text" id="modelo" placeholder="Modelo (ex: Corolla)" required>
      <input type="number" id="ano" placeholder="Ano (ex: 2023)" required min="1900" max="2030">
      <input type="text" id="cor" placeholder="Cor (ex: Prata)" required>
      <input type="number" id="preco" placeholder="Preço (ex: 25000)" required step="0.01">
      <button type="submit">Adicionar Carro</button>
    </form>

    <h2>Lista de Carros</h2>
    <button id="btn-listar">Listar Todos os Carros</button>
    <ul id="lista-carros"></ul>

    <h2>Buscar Carro por ID</h2>
    <div class="form-group">
      <input type="number" id="id-buscar" placeholder="ID do Carro">
      <button id="btn-buscar">Buscar</button>
    </div>
    <div id="carro-encontrado"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
